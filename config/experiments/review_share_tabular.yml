# Designite metric models trained on the consensus label or on the share of positive reviews.
# python scripts/cv/cv_tabular.py --config config/experiments/review_share_tabular.yml
run:
  name: review_share_tabular

tabular_cv:
  folds: artifacts/folds/mlcq_cv.json
  input_json: data/derived/MLCQCodeSmellSamples.normalized.rule_default.json
  review_shares: data/derived/mlcq_review_shares.json
  strategies: [kfold]
  seeds: null
  threshold_steps: 101
  out_dir: artifacts/tabular_cv/review_share
  feature_sets:
    designite:
      source: csv
      path: data/derived/designite_metrics.csv
      missing: train_median
  models:
    xgb:
      type: xgboost
      n_estimators: 200
      max_depth: 5
      lr: 0.1
    logreg:
      type: logistic_regression
      C: 1.0
      # no class weights so that the shares are fit as probabilities
      class_weight: null
      max_iter: 2000
  runs:
    - {name: designite__xgb__consensus, features: [designite], model: xgb, target: consensus}
    - {name: designite__xgb__review_share, features: [designite], model: xgb, target: review_share}
    - {name: designite__logreg__consensus, features: [designite], model: logreg, target: consensus}
    - {name: designite__logreg__review_share, features: [designite], model: logreg, target: review_share}
