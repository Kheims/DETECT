# DACOS method snippets as a second dataset.
# scripts/data/convert_dacos.py, scripts/cv/make_cv_folds.py
dacos:
  # column order of y and of every score matrix, never reorder
  label_order: [is_complex_method, is_long_parameter_list]

  convert:
    sql_dump: ~/Repositories/personal/Thesis/smells_agents_detection/data/raw/dacos/DACOSMain.sql
    snippet_zip: ~/Repositories/personal/Thesis/smells_agents_detection/data/raw/dacos/files.zip
    # annotation column -> smell name (isim is never set in the dump)
    flags:
      iscm: complex method
      islp: long parameter list
      isma: multifaceted abstraction
    method_smells: [complex method, long parameter list]
    class_smells: [multifaceted abstraction]
    out_methods: data/derived/dacos/dacos_methods.normalized.json
    out_classes: data/derived/dacos/dacos_classes.normalized.json
    # per method snippet: sampling codes and whether each smell was offered
    out_meta_csv: data/derived/dacos/dacos_sample_meta.csv
    # sampling code (sample.smells) that makes the tool offer the smell
    offered_codes:
      complex method: 1
      long parameter list: 2

  folds:
    input_json: data/derived/dacos/dacos_methods.normalized.json
    out: artifacts/folds/dacos_cv.json
    n_folds: 5
    val_ratio: 0.1
    seeds: [42, 43, 44, 45, 46]
    # logo: leave one project out
    strategies: [kfold, group_kfold, logo]
    group_key: project
