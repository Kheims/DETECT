_include_yml: ../defaults.yml

run:
  name: classical_xgboost_pipeline
  artifacts_root: artifacts

normalization:
  enabled: true
  input_json: data/MLCQCodeSmellSamples.json
  method: median
  rule: default

construction:
  enabled: false

metric_extraction:
  enabled: true
  tool: designite
  batch_size: 500
  workers: 6

dataset:
  enabled: false

token_encoder:
  enabled: false

token_dataset:
  enabled: false

training:
  enabled: true
  used_method: classical
  model: xgboost
  cross_validation: true
  n_folds: 5
  seeds: [42, 43, 44, 45, 46]
  threshold_tuning: true
  model_params:
    n_estimators: 100
    max_depth: 5
    lr: 0.1
  param_grid:
    n_estimators: [100, 200]
    max_depth: [3, 5, 7]
    lr: [0.05, 0.1]
