_include_yml: ../defaults.yml

run:
  name: random_forest_metrics

construction:
  enabled: false
dataset:
  enabled: false
  metrics_csv: artifacts/metrics_dataset.csv
token_encoder:
  enabled: false

training:
  enabled: true
  method: classical_ml
  model: random_forest
  cross_validation: true
  n_folds: 5
  seeds: [42, 43, 44, 45, 46]
  model_params:
    n_estimators: 200
    max_depth: null
    min_samples_split: 2
  param_grid:
    n_estimators: [100, 200, 500]
    max_depth: [null, 10, 20, 30]
