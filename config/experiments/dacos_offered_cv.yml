# DACOS tabular models and probes retrained on the snippets where each smell was offered.
# python scripts/cv/make_cv_folds.py --config config/experiments/dacos_offered_cv.yml --section offered_complex_method
# then python scripts/cv/cv_tabular.py and scripts/cv/eval_eligible.py with the same --config
run:
  name: dacos_offered_cv

offered_complex_method:
  label_order: [is_complex_method, is_long_parameter_list]
  folds: &offered_folds
    input_json: data/derived/dacos/dacos_methods.normalized.json
    out: artifacts/folds/dacos_cv_offered_complex_method.json
    n_folds: 5
    val_ratio: 0.1
    seeds: [42, 43, 44, 45, 46]
    strategies: [kfold]
    group_key: project
    # snippets whose sampling code offered complex method (codes 1 and 1+2)
    subset: {csv: data/derived/dacos/dacos_sample_meta.csv, key: json_index, column: offered_complex_method}

offered_long_parameter_list:
  label_order: [is_complex_method, is_long_parameter_list]
  folds:
    <<: *offered_folds
    out: artifacts/folds/dacos_cv_offered_long_parameter_list.json
    # snippets whose sampling code offered long parameter list (codes 2 and 1+2)
    subset: {csv: data/derived/dacos/dacos_sample_meta.csv, key: json_index, column: offered_long_parameter_list}

# feature sets, models and runs of dacos_tabular.yml and dacos_probes.yml
tabular_cv:
  folds: artifacts/folds/dacos_cv_offered_complex_method.json
  input_json: data/derived/dacos/dacos_methods.normalized.json
  # checked against meta.label_order of the folds file
  label_order: [is_complex_method, is_long_parameter_list]
  strategies: [kfold]
  seeds: null
  threshold_steps: 101
  out_dir: artifacts/dacos/offered_cv/complex_method
  # validation score that picks C for the probes (macro over both labels)
  selection_metric: pr_auc_macro
  skip_existing: false
  missing_features: error

  feature_sets:
    # tabular sets (dacos_tabular.yml)
    size_features:
      source: csv
      path: data/derived/dacos/size_features.csv
      key: sample_idx
      columns: [loc_physical, loc_nonblank, chars, tokens, ast_nodes, ast_depth, n_methods, n_fields,
                n_statements, n_params_first_method, max_block_nesting, n_distinct_identifiers,
                n_classes, n_comments]
      transform: signed_log1p
    loc_only:
      source: csv
      path: data/derived/dacos/size_features.csv
      key: sample_idx
      columns: [loc_nonblank]
      transform: signed_log1p
    params_only:
      source: csv
      path: data/derived/dacos/size_features.csv
      key: sample_idx
      columns: [n_params_first_method]
      transform: signed_log1p
    designite:
      source: csv
      path: data/derived/dacos/designite_metrics.csv
      key: sample_idx
      columns: [cc, loc, pc]
      transform: signed_log1p
    cc_only:
      source: csv
      path: data/derived/dacos/designite_metrics.csv
      key: sample_idx
      columns: [cc]
      transform: signed_log1p
    pc_only:
      source: csv
      path: data/derived/dacos/designite_metrics.csv
      key: sample_idx
      columns: [pc]
      transform: signed_log1p
    # probe sets (dacos_probes.yml)
    designite_raw:
      source: csv
      path: data/derived/dacos/designite_metrics.csv
      key: sample_idx
      columns: [cc, loc, pc]
    emb_codebert: {source: npy, path: artifacts/dacos/embeddings/codebert/emb.npy, index: artifacts/dacos/embeddings/codebert/index.json}
    emb_codebert_chunk: {source: npy, path: artifacts/dacos/embeddings/codebert_chunk/emb.npy, index: artifacts/dacos/embeddings/codebert_chunk/index.json}
    emb_graphcodebert: {source: npy, path: artifacts/dacos/embeddings/graphcodebert/emb.npy, index: artifacts/dacos/embeddings/graphcodebert/index.json}
    emb_unixcoder: {source: npy, path: artifacts/dacos/embeddings/unixcoder/emb.npy, index: artifacts/dacos/embeddings/unixcoder/index.json}
    emb_codet5p_110m: {source: npy, path: artifacts/dacos/embeddings/codet5p_110m/emb.npy, index: artifacts/dacos/embeddings/codet5p_110m/index.json}
    emb_modernbert: {source: npy, path: artifacts/dacos/embeddings/modernbert/emb.npy, index: artifacts/dacos/embeddings/modernbert/index.json}
    emb_qwen3_emb_06b: {source: npy, path: artifacts/dacos/embeddings/qwen3_emb_06b/emb.npy, index: artifacts/dacos/embeddings/qwen3_emb_06b/index.json}
    emb_qwen3_emb_06b_noinst: {source: npy, path: artifacts/dacos/embeddings/qwen3_emb_06b_noinst/emb.npy, index: artifacts/dacos/embeddings/qwen3_emb_06b_noinst/index.json}
    emb_qwen3_emb_4b: {source: npy, path: artifacts/dacos/embeddings/qwen3_emb_4b/emb.npy, index: artifacts/dacos/embeddings/qwen3_emb_4b/index.json}
    emb_qwen25_coder_15b: {source: npy, path: artifacts/dacos/embeddings/qwen25_coder_15b/emb.npy, index: artifacts/dacos/embeddings/qwen25_coder_15b/index.json}
    emb_qwen25_coder_7b_instruct: {source: npy, path: artifacts/dacos/embeddings/qwen25_coder_7b_instruct/emb.npy, index: artifacts/dacos/embeddings/qwen25_coder_7b_instruct/index.json}
    emb_codebert_cls: {source: npy, path: artifacts/dacos/embeddings/codebert/emb_cls_layer12.npy, index: artifacts/dacos/embeddings/codebert/index.json}
    emb_graphcodebert_cls: {source: npy, path: artifacts/dacos/embeddings/graphcodebert/emb_cls_layer12.npy, index: artifacts/dacos/embeddings/graphcodebert/index.json}
    emb_modernbert_cls: {source: npy, path: artifacts/dacos/embeddings/modernbert/emb_cls_layer22.npy, index: artifacts/dacos/embeddings/modernbert/index.json}
    emb_qwen25_coder_15b_last: {source: npy, path: artifacts/dacos/embeddings/qwen25_coder_15b/emb_last_token_layer28.npy, index: artifacts/dacos/embeddings/qwen25_coder_15b/index.json}
    emb_qwen25_coder_7b_instruct_last: {source: npy, path: artifacts/dacos/embeddings/qwen25_coder_7b_instruct/emb_last_token_layer28.npy, index: artifacts/dacos/embeddings/qwen25_coder_7b_instruct/index.json}
    emb_qwen25_coder_15b_l7: {source: npy, path: artifacts/dacos/embeddings/qwen25_coder_15b/emb_mean_layer7.npy, index: artifacts/dacos/embeddings/qwen25_coder_15b/index.json}
    emb_qwen25_coder_15b_l14: {source: npy, path: artifacts/dacos/embeddings/qwen25_coder_15b/emb_mean_layer14.npy, index: artifacts/dacos/embeddings/qwen25_coder_15b/index.json}
    emb_qwen25_coder_15b_l21: {source: npy, path: artifacts/dacos/embeddings/qwen25_coder_15b/emb_mean_layer21.npy, index: artifacts/dacos/embeddings/qwen25_coder_15b/index.json}
    emb_qwen25_coder_7b_instruct_l14: {source: npy, path: artifacts/dacos/embeddings/qwen25_coder_7b_instruct/emb_mean_layer14.npy, index: artifacts/dacos/embeddings/qwen25_coder_7b_instruct/index.json}

  variants: {}

  models:
    # tabular models (dacos_tabular.yml)
    logreg:
      type: logistic_regression
      C: 1.0
      class_weight: balanced
      max_iter: 2000
    dt3:
      type: decision_tree
      max_depth: 3
    xgb:
      type: xgboost
      n_estimators: 200
      max_depth: 5
      lr: 0.1
    # probe candidates (dacos_probes.yml)
    logreg_C1e-5: {type: logistic_regression, C: 0.00001}
    logreg_C1e-4: {type: logistic_regression, C: 0.0001}
    logreg_C1e-3: {type: logistic_regression, C: 0.001}
    logreg_C1e-2: {type: logistic_regression, C: 0.01}
    logreg_C1e-1: {type: logistic_regression, C: 0.1}
    logreg_C1: {type: logistic_regression, C: 1.0}
    logreg_C10: {type: logistic_regression, C: 10.0}
    logreg_C100: {type: logistic_regression, C: 100.0}

  probe_candidates: &probe [logreg_C1e-5, logreg_C1e-4, logreg_C1e-3, logreg_C1e-2, logreg_C1e-1, logreg_C1,
                            logreg_C10, logreg_C100]

  runs:
    # tabular runs: same names as artifacts/dacos/tabular_cv and offered_eval
    - {features: [size_features], model: logreg}
    - {features: [size_features], model: dt3}
    - {features: [size_features], model: xgb}
    - {features: [loc_only], model: logreg}
    - {features: [loc_only], model: dt3}
    - {features: [loc_only], model: xgb}
    - {features: [params_only], model: logreg}
    - {features: [params_only], model: dt3}
    - {features: [params_only], model: xgb}
    - {features: [designite], model: logreg}
    - {features: [designite], model: dt3}
    - {features: [designite], model: xgb}
    - {features: [cc_only], model: logreg}
    - {features: [cc_only], model: dt3}
    - {features: [cc_only], model: xgb}
    - {features: [pc_only], model: logreg}
    - {features: [pc_only], model: dt3}
    - {features: [pc_only], model: xgb}
    # probe runs: same names as artifacts/dacos/code_probes
    - {name: designite__probe, features: [designite_raw], model_candidates: *probe}
    - {name: codebert__probe, features: [emb_codebert], model_candidates: *probe}
    - {name: graphcodebert__probe, features: [emb_graphcodebert], model_candidates: *probe}
    - {name: unixcoder__probe, features: [emb_unixcoder], model_candidates: *probe}
    - {name: codet5p_110m__probe, features: [emb_codet5p_110m], model_candidates: *probe}
    - {name: modernbert__probe, features: [emb_modernbert], model_candidates: *probe}
    - {name: qwen3_emb_06b__probe, features: [emb_qwen3_emb_06b], model_candidates: *probe}
    - {name: qwen3_emb_4b__probe, features: [emb_qwen3_emb_4b], model_candidates: *probe}
    - {name: qwen25_coder_15b__probe, features: [emb_qwen25_coder_15b], model_candidates: *probe}
    - {name: qwen25_coder_7b_instruct__probe, features: [emb_qwen25_coder_7b_instruct], model_candidates: *probe}
    - {name: codebert_chunk__probe, features: [emb_codebert_chunk], model_candidates: *probe}
    - {name: qwen3_emb_06b_noinst__probe, features: [emb_qwen3_emb_06b_noinst], model_candidates: *probe}
    - {name: codebert_cls__probe, features: [emb_codebert_cls], model_candidates: *probe}
    - {name: graphcodebert_cls__probe, features: [emb_graphcodebert_cls], model_candidates: *probe}
    - {name: modernbert_cls__probe, features: [emb_modernbert_cls], model_candidates: *probe}
    - {name: qwen25_coder_15b_last__probe, features: [emb_qwen25_coder_15b_last], model_candidates: *probe}
    - {name: qwen25_coder_7b_instruct_last__probe, features: [emb_qwen25_coder_7b_instruct_last], model_candidates: *probe}
    - {name: qwen25_coder_15b_l7__probe, features: [emb_qwen25_coder_15b_l7], model_candidates: *probe}
    - {name: qwen25_coder_15b_l14__probe, features: [emb_qwen25_coder_15b_l14], model_candidates: *probe}
    - {name: qwen25_coder_15b_l21__probe, features: [emb_qwen25_coder_15b_l21], model_candidates: *probe}
    - {name: qwen25_coder_7b_instruct_l14__probe, features: [emb_qwen25_coder_7b_instruct_l14], model_candidates: *probe}
    # embedding chosen per fold with C, by validation macro PR-AUC
    - name: best_embedding+designite__probe
      feature_candidates:
        - [emb_codebert, designite_raw]
        - [emb_graphcodebert, designite_raw]
        - [emb_unixcoder, designite_raw]
        - [emb_codet5p_110m, designite_raw]
        - [emb_modernbert, designite_raw]
        - [emb_qwen3_emb_06b, designite_raw]
        - [emb_qwen3_emb_4b, designite_raw]
        - [emb_qwen25_coder_15b, designite_raw]
        - [emb_qwen25_coder_7b_instruct, designite_raw]
      model_candidates: *probe

# probes trained on all snippets, rescored on the offered samples
eligible_eval:
  sample_meta: data/derived/dacos/dacos_sample_meta.csv
  label_order: [is_complex_method, is_long_parameter_list]
  eligibility_columns:
    is_complex_method: offered_complex_method
    is_long_parameter_list: offered_long_parameter_list
  threshold_steps: 101
  out_dir: artifacts/dacos/offered_cv/rescored_probes
  inputs:
    - {name: designite__probe, predictions: artifacts/dacos/code_probes/designite__probe/predictions.jsonl}
    - {name: codebert__probe, predictions: artifacts/dacos/code_probes/codebert__probe/predictions.jsonl}
    - {name: graphcodebert__probe, predictions: artifacts/dacos/code_probes/graphcodebert__probe/predictions.jsonl}
    - {name: unixcoder__probe, predictions: artifacts/dacos/code_probes/unixcoder__probe/predictions.jsonl}
    - {name: codet5p_110m__probe, predictions: artifacts/dacos/code_probes/codet5p_110m__probe/predictions.jsonl}
    - {name: modernbert__probe, predictions: artifacts/dacos/code_probes/modernbert__probe/predictions.jsonl}
    - {name: qwen3_emb_06b__probe, predictions: artifacts/dacos/code_probes/qwen3_emb_06b__probe/predictions.jsonl}
    - {name: qwen3_emb_4b__probe, predictions: artifacts/dacos/code_probes/qwen3_emb_4b__probe/predictions.jsonl}
    - {name: qwen25_coder_15b__probe, predictions: artifacts/dacos/code_probes/qwen25_coder_15b__probe/predictions.jsonl}
    - {name: qwen25_coder_7b_instruct__probe, predictions: artifacts/dacos/code_probes/qwen25_coder_7b_instruct__probe/predictions.jsonl}
    - {name: codebert_chunk__probe, predictions: artifacts/dacos/code_probes/codebert_chunk__probe/predictions.jsonl}
    - {name: qwen3_emb_06b_noinst__probe, predictions: artifacts/dacos/code_probes/qwen3_emb_06b_noinst__probe/predictions.jsonl}
    - {name: codebert_cls__probe, predictions: artifacts/dacos/code_probes/codebert_cls__probe/predictions.jsonl}
    - {name: graphcodebert_cls__probe, predictions: artifacts/dacos/code_probes/graphcodebert_cls__probe/predictions.jsonl}
    - {name: modernbert_cls__probe, predictions: artifacts/dacos/code_probes/modernbert_cls__probe/predictions.jsonl}
    - {name: qwen25_coder_15b_last__probe, predictions: artifacts/dacos/code_probes/qwen25_coder_15b_last__probe/predictions.jsonl}
    - {name: qwen25_coder_7b_instruct_last__probe, predictions: artifacts/dacos/code_probes/qwen25_coder_7b_instruct_last__probe/predictions.jsonl}
    - {name: qwen25_coder_15b_l7__probe, predictions: artifacts/dacos/code_probes/qwen25_coder_15b_l7__probe/predictions.jsonl}
    - {name: qwen25_coder_15b_l14__probe, predictions: artifacts/dacos/code_probes/qwen25_coder_15b_l14__probe/predictions.jsonl}
    - {name: qwen25_coder_15b_l21__probe, predictions: artifacts/dacos/code_probes/qwen25_coder_15b_l21__probe/predictions.jsonl}
    - {name: qwen25_coder_7b_instruct_l14__probe, predictions: artifacts/dacos/code_probes/qwen25_coder_7b_instruct_l14__probe/predictions.jsonl}
