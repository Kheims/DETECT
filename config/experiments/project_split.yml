_include_yml: fe_relational_base.yml

# Project-disjoint evaluation of the reference GCN, with and without the
# own/foreign access counts.
run:
  name: project_split

training:
  split_strategy: group
  split_group_key: repo_url

ablation:
  enabled: true
  seeds: [42, 43, 44]
  grid:
    training.architecture: [gcn]
    training.loss: [focal]
    training.graph_features:
      - null
      - path: data/relational_features.csv
        key: sample_idx
        log1p: true
        columns: [l0_own_field, l0_own_call, l0_own_total, l0_foreign_project,
                  l0_foreign_external, l0_foreign_unresolved, l0_distinct_project_types,
                  l0_max_single_project_type, l0_envy_ratio, l0_foreign_ratio, l0_envy_rule]
