_include_yml: gnn_cv.yml

# GCN, BiLSTM with attention and their two late fusions under the cross-validation protocol of gnn_cv.yml.
run:
  name: hybrid_cv

training:
  seq_max_tokens: 512
  seq_min_freq: 2
  seq_max_vocab: 10000
  seq_embed_dim: 128
  seq_hidden_dim: 256
  seq_num_layers: 2
  seq_dropout: 0.3
  seq_mask_padding: false

ablation:
  enabled: true
  seeds: [42, 43, 44, 45, 46]
  grid:
    training.architecture: [gcn]
    training.loss: [focal]
    training.hybrid_branch: [graph, seq, hybrid, hybrid_weighted]
    training.split_strategy: [kfold, group_kfold]
    training.cv_fold: [0, 1, 2, 3, 4]
