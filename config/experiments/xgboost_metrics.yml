_include_yml: ../defaults.yml

run:
  name: xgboost_metrics

construction:
  enabled: false
dataset:
  enabled: false
  metrics_csv: artifacts/metrics_dataset.csv
token_encoder:
  enabled: false

training:
  enabled: true
  method: classical_ml
  model: xgboost
  cross_validation: true
  n_folds: 5
  seeds: [42, 43, 44, 45, 46]
  threshold_tuning: true
  model_params:
    n_estimators: 200
    max_depth: 5
    lr: 0.1
  param_grid:
    n_estimators: [100, 200, 500]
    max_depth: [3, 5, 10]
