_include_yml: ../defaults.yml

run:
  name: cnn_tokens

construction:
  enabled: false
dataset:
  enabled: false
  token_dir: artifacts/token_dataset
token_encoder:
  enabled: false

training:
  enabled: true
  method: sequence_dl
  model: cnn
  seed: 42
  train_ratio: 0.8
  val_ratio: 0.1
  epochs: 50
  patience: 10
  lr: 0.001
  batch_size: 32
  embed_dim: 128
  num_filters: 128
  filter_sizes: [3, 4, 5]
  dropout: 0.3
  loss: focal
